<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  var STORE = 'wv-preview:' + P.salt;
  var form = document.getElementById('gate'), pw = document.getElementById('pw');
  var err = document.getElementById('err'), go = document.getElementById('go'), toggle = document.getElementById('toggle');
  var supported = !!(window.crypto && crypto.subtle && window.DecompressionStream && window.TextEncoder);

  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function base64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  function deriveKey(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iterations },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)).then(function (packed) {
      return new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    });
  }
  // Swap in the decrypted page, then run each of its scripts exactly once, in order, as a normal page load
  // would. Scripts are made inert before the swap (some browsers run imported scripts on insertion), and one
  // broken script doesn't stop the rest. (document.write skipped scripts after a failed external one.)
  var skipOldGate = false;
  function reveal(html) {
    // The older Willovita site has its own password screen; mark it passed for this session.
    if (skipOldGate) { try { sessionStorage.setItem('wv_access', 'granted'); } catch (e) {} }
    var page = new DOMParser().parseFromString(html, 'text/html');
    Array.prototype.forEach.call(page.querySelectorAll('script'), function (el) {
      el.setAttribute('data-wv-type', el.getAttribute('type') || '');
      el.setAttribute('type', 'text/x-wv-inert');
    });
    document.replaceChild(document.importNode(page.documentElement, true), document.documentElement);
    var scripts = Array.prototype.slice.call(document.querySelectorAll('script[type="text/x-wv-inert"]'));
    function swap(old, s) {
      try { old.parentNode.replaceChild(s, old); } catch (e) { setTimeout(function () { throw e; }); }
    }
    (function run(i) {
      if (i === scripts.length) {
        // Its own "already unlocked" check may never run (the live copy of that page is cut off), so hide it here.
        var oldGate = skipOldGate && document.getElementById('siteGate');
        if (oldGate) { oldGate.style.display = 'none'; document.body.style.overflow = ''; }
        document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
        window.dispatchEvent(new Event('load'));
        return;
      }
      var old = scripts[i], s = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        var a = old.attributes[j];
        if (a.name !== 'type' && a.name !== 'data-wv-type') s.setAttribute(a.name, a.value);
      }
      if (old.getAttribute('data-wv-type')) s.setAttribute('type', old.getAttribute('data-wv-type'));
      if (old.hasAttribute('src')) {
        s.onload = s.onerror = function () { run(i + 1); };
        swap(old, s);
      } else {
        s.textContent = old.textContent;
        swap(old, s);
        run(i + 1);
      }
    })(0);
  }
  function fail(message) {
    document.documentElement.classList.remove('reopening');
    err.textContent = message; err.hidden = false;
    go.disabled = false; go.textContent = 'View preview';
    pw.setAttribute('aria-invalid', 'true'); pw.focus(); pw.select();
  }

  // Reopen without asking again in the same tab, until it is closed.
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved && supported) {
    crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(reveal, function () {
      try { sessionStorage.removeItem(STORE); } catch (e) {}
      document.documentElement.classList.remove('reopening');
    });
  } else {
    document.documentElement.classList.remove('reopening');
  }

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', String(show));
    pw.focus();
  });
  pw.addEventListener('input', function () { err.hidden = true; pw.removeAttribute('aria-invalid'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!supported) return fail('This browser can’t open the preview. Try a current version of Safari, Chrome, Firefox or Edge.');
    if (!pw.value) return fail('Enter the preview password.');
    err.hidden = true; go.disabled = true; go.textContent = 'Unlocking…';
    var key;
    deriveKey(pw.value).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(STORE, base64(raw)); } catch (e) {}
        reveal(html);
      });
    }, function () { fail('That password doesn’t match. Check for typos and try again.'); });
  });
})();
